<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Amministrazione — Easy Come</title>
<style>:root{--ink:#171815;--orange:#ff6433;--paper:#f4f0e8;--surface:#fff;--line:#ddd6ca;--muted:#747168;--green:#16865b}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,sans-serif}.shell{display:grid;grid-template-columns:230px minmax(0,1fr);min-height:100vh}.side{background:var(--ink);color:#fff;padding:22px 16px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;padding:5px 6px 28px}.brand b{width:44px;height:44px;border-radius:14px;background:var(--orange);display:grid;place-items:center}.brand span{display:grid}.brand small{color:#ffffff6f}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#ffffffa0;padding:11px;border-radius:11px;text-align:left}.nav button.active,.nav button:hover{background:#fff;color:var(--ink)}.side footer{margin-top:auto;border-top:1px solid #ffffff1f;padding:15px 6px}.side footer button{width:100%;border:1px solid #ffffff31;background:transparent;color:#fff;border-radius:9px;padding:9px}.main{padding:28px clamp(20px,4vw,55px) 60px;min-width:0}.top{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:20px}.kicker{font-size:10px;letter-spacing:.15em;color:var(--orange);font-weight:900}.top h1{font:700 clamp(40px,5vw,65px)/.94 Georgia,serif;letter-spacing:-.05em;margin:8px 0}.top p{margin:0;color:var(--muted)}.btn{padding:11px 15px;border:0;border-radius:11px;background:var(--orange);color:#fff;font-weight:850}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:20px;box-shadow:0 9px 30px #00000005}.login{max-width:480px;margin:8vh auto}.field{display:grid;gap:6px;margin:12px 0}.field span{font-size:11px;font-weight:800}.field input{padding:12px;border:1px solid var(--line);border-radius:10px}.error{color:#9f2f2f;margin-top:10px}.hidden{display:none!important}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:13px}.metric{background:#fff;border:1px solid var(--line);border-radius:17px;padding:17px}.metric span{font-size:10px;color:var(--muted);font-weight:850}.metric strong{display:block;font-size:28px;margin-top:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px;font-size:12px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0eee9;font-size:10px;font-weight:800}.status.paid,.status.active{background:#e8f7ef;color:#13734e}.status.received,.status.reviewing{background:#fff1e9;color:#b84c24}.money{font-weight:900}.muted{color:var(--muted)}.empty{padding:40px;text-align:center;color:var(--muted)}.request-cards{display:grid;gap:10px}.request{border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px}.request h3{margin:4px 0}.request p{color:var(--muted);line-height:1.5;margin:6px 0}.request-meta{display:flex;gap:7px;flex-wrap:wrap}.request aside{text-align:right}.request aside small{display:block;color:var(--muted);margin-top:6px}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:static}.nav{grid-template-columns:repeat(3,1fr)}.side footer{display:none}.main{padding:22px 14px 50px}.top{display:block}.top .btn{margin-top:14px}.metric-grid{grid-template-columns:1fr 1fr}.request{grid-template-columns:1fr}.request aside{text-align:left}}</style></head>
<body><div class="shell"><aside class="side"><div class="brand"><b>EC</b><span><strong>Easy Come</strong><small>Amministrazione</small></span></div><nav class="nav hidden" id="adminNav"><button data-view="orders" class="active">Ordini</button><button data-view="requests">Richieste e incontri</button><button data-view="subscriptions">Gestione mensile</button></nav><footer><button id="logout" class="hidden">Esci</button></footer></aside><main class="main"><header class="top"><div><span class="kicker">PANNELLO EASY COME</span><h1 id="pageTitle">Amministrazione</h1><p id="pageCopy">Ordini, richieste e servizi tecnici dei clienti.</p></div><button class="btn secondary hidden" id="refresh">Aggiorna</button></header><section class="card login" id="login"><h2>Accesso amministratore</h2><p class="muted">Accedi con l’utente presente nella tabella <code>easycome_admins</code>.</p><form id="loginForm"><label class="field"><span>Email</span><input type="email" name="email" required></label><label class="field"><span>Password</span><input type="password" name="password" required></label><button class="btn">Accedi</button><div class="error" id="loginError"></div></form></section><div id="dashboard" class="hidden"><section class="metric-grid" id="metrics"></section><section class="card" id="content"></section></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin-config.js"></script><script>
const cfg=window.EASYCOME_ADMIN||{}, $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];let db=null,view='orders',cache={orders:[],requests:[],subscriptions:[]};const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),money=c=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(c||0)/100),status=s=>({paid:'Pagato',checkout_created:'Checkout creato',processing:'In elaborazione',received:'Ricevuta',reviewing:'In valutazione',planned:'Pianificata',answered:'Risposta inviata',closed:'Chiusa',active:'Attiva',trialing:'In prova',past_due:'Pagamento da aggiornare',canceled:'Terminata'}[s]||s||'—');if(cfg.supabaseUrl&&cfg.supabaseAnonKey)db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);else $('#loginError').textContent='Configura js/admin-config.js.';
function toggle(on){$('#login').classList.toggle('hidden',on);$('#dashboard').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);$('#refresh').classList.toggle('hidden',!on);$('#adminNav').classList.toggle('hidden',!on)}
function renderMetrics(){const paid=cache.orders.filter(o=>o.status==='paid').reduce((n,o)=>n+Number(o.amount_cents||0),0),open=cache.requests.filter(r=>r.status!=='closed').length,meetings=cache.requests.filter(r=>['consultation','custom_solution'].includes(r.kind)&&r.status!=='closed').length,active=cache.subscriptions.filter(s=>['active','trialing'].includes(s.status)).length;$('#metrics').innerHTML=`<article class="metric"><span>INCASSI TEST/LIVE</span><strong>${money(paid)}</strong></article><article class="metric"><span>RICHIESTE APERTE</span><strong>${open}</strong></article><article class="metric"><span>INCONTRI DA CONFERMARE</span><strong>${meetings}</strong></article><article class="metric"><span>GESTIONI ATTIVE</span><strong>${active}</strong></article>`}
function ordersView(){return `<div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Progetto</th><th>Tipo</th><th>Totale</th><th>Stato</th><th>Download</th><th>Ordine</th></tr></thead><tbody>${cache.orders.length?cache.orders.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('it-IT')}</td><td><strong>${esc(o.customer_name)}</strong><br><span class="muted">${esc(o.customer_email)}</span></td><td>${esc(o.company_name)}</td><td>${esc(o.purchase_type==='managed_service'?'Gestione tecnica':o.managed_service_selected?'Software + Managed':'Software')}</td><td class="money">${money(o.amount_cents)}</td><td><span class="status ${esc(o.status)}">${esc(status(o.status))}</span></td><td>${Number(o.download_count||0)}</td><td><code>${esc(o.id.slice(0,8))}</code></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Nessun ordine.</td></tr>'}</tbody></table></div>`}
function requestView(){return cache.requests.length?`<div class="request-cards">${cache.requests.map(r=>`<article class="request"><div><span class="kicker">${esc((r.kind||'support').replaceAll('_',' '))}</span><h3>${esc(r.subject)}</h3><p>${esc(r.description)}</p><div class="request-meta"><span class="status ${esc(r.status)}">${esc(status(r.status))}</span><span class="status">${esc(r.priority)}</span>${r.metadata?.preferred_date?`<span class="status">${esc(r.metadata.preferred_date)} · ${esc(r.metadata.preferred_time||'')}</span>`:''}</div></div><aside><strong>${esc(r.company_name||'')}</strong><small>${esc(r.customer_email||'')}</small><small>${new Date(r.created_at).toLocaleString('it-IT')}</small><button class="btn secondary reply-btn" data-reply="${esc(r.id)}">Rispondi / aggiorna</button></aside></article>`).join('')}</div>`:'<div class="empty">Nessuna richiesta.</div>'}
function subscriptionsView(){return `<div class="table-wrap"><table><thead><tr><th>Cliente</th><th>Piano</th><th>Importo</th><th>Stato</th><th>Prossimo periodo</th><th>Stripe</th></tr></thead><tbody>${cache.subscriptions.length?cache.subscriptions.map(s=>`<tr><td>${esc(s.user_id.slice(0,8))}</td><td><strong>${esc(s.plan_name)}</strong><br><span class="muted">${esc(s.plan_code)}</span></td><td class="money">${money(s.amount_cents)} / mese</td><td><span class="status ${esc(s.status)}">${esc(status(s.status))}</span></td><td>${s.current_period_end?new Date(s.current_period_end).toLocaleDateString('it-IT'):'—'}</td><td><code>${esc((s.stripe_subscription_id||'—').slice(0,18))}</code></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nessun servizio mensile.</td></tr>'}</tbody></table></div>`}
function render(){renderMetrics();const titles={orders:['Ordini e pagamenti','Acquisti software e consegne.'],requests:['Richieste e incontri','Assistenza, nuove funzioni e appuntamenti da confermare.'],subscriptions:['Gestione mensile','Abbonamenti Easy Come Managed da 30 € al mese.']};$('#pageTitle').textContent=titles[view][0];$('#pageCopy').textContent=titles[view][1];$('#content').innerHTML=view==='orders'?ordersView():view==='requests'?requestView():subscriptionsView();$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('[data-reply]').forEach(b=>b.onclick=()=>replyRequest(b.dataset.reply))}

async function replyRequest(id){const row=cache.requests.find(r=>r.id===id);if(!row)return;const reply=prompt('Risposta visibile al cliente:',row.admin_reply||'');if(reply===null)return;const nextStatus=prompt('Stato: received, reviewing, planned, answered, closed',reply.trim()?'answered':row.status)||row.status;const {error}=await db.from('easycome_support_requests').update({admin_reply:reply.trim()||null,status:nextStatus,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);return}await load()}
async function load(){const [o,r,s]=await Promise.all([db.from('easycome_orders').select('*').order('created_at',{ascending:false}).limit(250),db.from('easycome_support_requests').select('*').order('created_at',{ascending:false}).limit(250),db.from('easycome_subscriptions').select('*').order('created_at',{ascending:false}).limit(250)]);for(const x of [o,r,s])if(x.error){$('#content').innerHTML=`<div class="error">${esc(x.error.message)}</div>`;return}cache={orders:o.data||[],requests:r.data||[],subscriptions:s.data||[]};render()}
$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';const f=new FormData(e.currentTarget);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('#loginError').textContent=error.message;return}toggle(true);load()};$('#logout').onclick=async()=>{await db.auth.signOut();toggle(false)};$('#refresh').onclick=load;$$('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});(async()=>{if(!db)return;const {data}=await db.auth.getSession();toggle(Boolean(data.session));if(data.session)load()})();
</script></body></html>
