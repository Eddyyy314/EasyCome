<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordini — Easy Come</title><style>:root{--ink:#171611;--orange:#f25b2a;--paper:#f7f1e7;--line:#cbc3b7;--muted:#716b60}*{box-sizing:border-box}body{margin:0;background:#e9e2d6;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif}.shell{max-width:1280px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--ink);padding-bottom:20px}.kicker{font-size:9px;letter-spacing:.18em;color:var(--orange);font-weight:800}h1{font:500 52px/1 Georgia,serif;margin:8px 0 0}.card{background:var(--paper);border:1px solid var(--ink);padding:22px;margin-top:20px}.login{max-width:480px}.field{display:grid;gap:6px;margin:12px 0}.field span{font-size:10px;text-transform:uppercase;letter-spacing:.08em}.field input{padding:12px;border:1px solid var(--line);background:#fff}.btn{padding:12px 16px;border:1px solid var(--ink);background:var(--orange);color:#fff;font-weight:800;cursor:pointer}.secondary{background:transparent;color:var(--ink)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);vertical-align:top}th{font-size:9px;letter-spacing:.12em;text-transform:uppercase}.status{display:inline-block;padding:5px 7px;border:1px solid var(--ink)}.status.paid{background:#dcefe4;color:#14633f;border-color:#73a98a}.money{font-weight:900}.muted{color:var(--muted)}.actions{display:flex;gap:8px}.hidden{display:none}.error{color:#9f2f2f;margin-top:10px}.empty{padding:35px;text-align:center;color:var(--muted)}@media(max-width:800px){.shell{padding:18px}.top{display:block}h1{font-size:42px}.table-wrap{overflow:auto}}</style></head><body><main class="shell"><header class="top"><div><span class="kicker">EASY COME · AMMINISTRAZIONE</span><h1>Ordini e pagamenti</h1></div><div class="actions"><button class="btn secondary hidden" id="refresh">Aggiorna</button><button class="btn secondary hidden" id="logout">Esci</button></div></header><section class="card login" id="login"><h2>Accesso amministratore</h2><p class="muted">Accedi con l’utente inserito in <code>easycome_admins</code>.</p><form id="loginForm"><label class="field"><span>Email</span><input type="email" name="email" required></label><label class="field"><span>Password</span><input type="password" name="password" required></label><button class="btn">Accedi</button><div class="error" id="loginError"></div></form></section><section class="card hidden" id="orders"><div class="table-wrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Progetto</th><th>Totale</th><th>Stato</th><th>Ordine</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin-config.js"></script><script>
const cfg=window.EASYCOME_ADMIN||{};const $=s=>document.querySelector(s);let db=null;const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=c=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(c||0)/100);if(cfg.supabaseUrl&&cfg.supabaseAnonKey)db=supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey);else $('#loginError').textContent='Configura js/admin-config.js.';
async function session(){if(!db)return;const {data}=await db.auth.getSession();toggle(Boolean(data.session));if(data.session)load();}function toggle(on){$('#login').classList.toggle('hidden',on);$('#orders').classList.toggle('hidden',!on);$('#logout').classList.toggle('hidden',!on);$('#refresh').classList.toggle('hidden',!on)}async function load(){const {data,error}=await db.from('easycome_orders').select('id,created_at,customer_name,customer_email,company_name,amount_cents,status,stripe_session_id').order('created_at',{ascending:false}).limit(200);if(error){$('#rows').innerHTML=`<tr><td colspan="6" class="error">${esc(error.message)}</td></tr>`;return}$('#rows').innerHTML=data.length?data.map(o=>`<tr><td>${new Date(o.created_at).toLocaleString('it-IT')}</td><td><strong>${esc(o.customer_name)}</strong><br><span class="muted">${esc(o.customer_email)}</span></td><td>${esc(o.company_name)}</td><td class="money">${money(o.amount_cents)}</td><td><span class="status ${esc(o.status)}">${esc(o.status)}</span></td><td><code>${esc(o.id.slice(0,8))}</code></td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nessun ordine.</td></tr>'}$('#loginForm').onsubmit=async e=>{e.preventDefault();$('#loginError').textContent='';const f=new FormData(e.currentTarget);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error){$('#loginError').textContent=error.message;return}toggle(true);load()};$('#logout').onclick=async()=>{await db.auth.signOut();toggle(false)};$('#refresh').onclick=load;session();
</script></body></html>
