<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pagamento ricevuto — Easy Come</title>
  <meta name="theme-color" content="#f25b2a">
  <style>
    :root{--ink:#171611;--orange:#f25b2a;--paper:#f7f1e7;--muted:#716b60;--line:#cfc6b8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#ebe4d8;color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;background-image:linear-gradient(#00000009 1px,transparent 1px),linear-gradient(90deg,#00000006 1px,transparent 1px);background-size:32px 32px}.sheet{width:min(720px,100%);background:var(--paper);border:1px solid var(--ink);padding:38px;box-shadow:12px 12px 0 #0002}.mark{width:54px;height:54px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:25px}.kicker{display:block;margin-top:25px;color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.18em}h1{font:500 clamp(42px,7vw,68px)/.96 Georgia,serif;letter-spacing:-.05em;margin:12px 0 17px}p{color:var(--muted);line-height:1.65}.status{margin:28px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:16px 0;display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:20px;font-size:12px}.row span{color:var(--muted)}.row strong{text-align:right}.actions{display:flex;gap:10px;flex-wrap:wrap}.btn{display:inline-block;padding:13px 17px;border:1px solid var(--ink);color:var(--ink);text-decoration:none;font-size:12px;font-weight:800}.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}.note{font-size:10px;margin-top:23px}.error{border-left:3px solid #a93434;background:#f9e4e1;padding:12px;color:#8d2929;font-size:12px}
  </style>
</head>
<body>
  <main class="sheet"><div class="mark">✓</div><span class="kicker">ORDINE EASY COME</span><h1>Pagamento ricevuto.</h1><p id="lead">Stiamo verificando la conferma del pagamento e preparando la fase di implementazione.</p><section class="status" id="status"><div class="row"><span>Stato</span><strong>Verifica in corso…</strong></div></section><div class="actions"><a class="btn primary" href="/">Torna al sito</a><a class="btn" id="supportLink" href="#">Contatta Easy Come</a></div><p class="note">Le ricevute vengono inviate da Stripe quando la funzione è attiva nel tuo account Stripe.</p></main>
  <script src="js/sales-config.js"></script>
  <script>
    const esc=(v)=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
    const money=(cents,currency='eur')=>new Intl.NumberFormat('it-IT',{style:'currency',currency:String(currency).toUpperCase()}).format(Number(cents||0)/100);
    const support=window.EASYCOME_SALES?.supportEmail||'';const supportLink=document.querySelector('#supportLink');if(support){supportLink.href='mailto:'+support}else supportLink.style.display='none';
    const sessionId=new URLSearchParams(location.search).get('session_id');
    async function load(){
      if(!sessionId){document.querySelector('#status').innerHTML='<div class="error">Sessione di pagamento mancante.</div>';return;}
      try{
        const r=await fetch('/api/checkout-status?session_id='+encodeURIComponent(sessionId));
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||'Verifica non riuscita');
        document.querySelector('#lead').textContent=d.paid?'Il pagamento è confermato. Ti contatteremo per raccogliere gli ultimi dettagli e avviare l’implementazione.':'Il pagamento è ancora in elaborazione. Aggiorneremo l’ordine appena Stripe conferma l’esito.';
        document.querySelector('#status').innerHTML=`<div class="row"><span>Stato</span><strong>${d.paid?'Pagato':'In elaborazione'}</strong></div><div class="row"><span>Progetto</span><strong>${esc(d.companyName||'Gestionale personalizzato')}</strong></div><div class="row"><span>Totale</span><strong>${money(d.amountTotal,d.currency)}</strong></div><div class="row"><span>Numero ordine</span><strong>${esc(d.orderId||'—')}</strong></div><div class="row"><span>Email</span><strong>${esc(d.customerEmail||'—')}</strong></div>`;
      }catch(e){document.querySelector('#status').innerHTML=`<div class="error">${esc(e.message)}</div>`;}
    }
    load();
  </script>
</body></html>
