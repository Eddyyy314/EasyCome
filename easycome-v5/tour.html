s:repeat(4,1fr);gap:9px}.kpi{border:1px solid #d6cec2;padding:15px}.kpi strong{font-size:25px;display:block}.kpi span{font-size:9px;color:#777}.table{margin-top:16px;border:1px solid #d6cec2}.tr{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;padding:11px 12px;border-bottom:1px solid #e1dbd2;font-size:9px}.tr:first-child{font-weight:900;color:#777;background:#eee8de}.tr:last-child{border-bottom:0}.badge{display:inline-flex;padding:4px 7px;background:#275b4914;color:var(--green);font-weight:800}.auditbox{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.finding{border:1px solid #d2c9bc;padding:17px}.finding.warn{border-left:4px solid var(--orange)}.finding.risk{border-left:4px solid var(--red)}.finding small{font-size:8px;color:#777}.finding h4{margin:8px 0;font-size:14px}.finding p{font-size:9px;line-height:1.5;color:#666;margin:0}.decision{margin-top:26px;background:var(--ink);color:#fff;padding:24px;display:grid;grid-template-columns:.8fr 1.2fr;gap:30px}.decision h3{font:500 25px Georgia,serif;margin:0}.decision p{font-size:11px;line-height:1.55;color:#c8c3bb;margin:0}.bottom{position:fixed;bottom:0;right:0;left:270px;background:#f3eee4eF;border-top:1px solid var(--line);backdrop-filter:blur(12px);padding:12px 24px;display:flex;justify-content:space-between;z-index:20}.btn{min-height:45px;padding:0 20px;border:1px solid var(--ink);background:transparent;font-size:11px;font-weight:900;cursor:pointer;text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center}.btn.dark{background:var(--ink);color:#fff}.btn.orange{background:var(--orange);border-color:var(--orange);color:#fff}.hidden{display:none!important}.process-picker{display:flex;gap:7px;flex-wrap:wrap;margin-top:25px}.process-picker button{border:1px solid var(--line);background:transparent;padding:9px 12px;font-size:10px;cursor:pointer}.process-picker button.active{background:var(--ink);color:#fff;border-color:var(--ink)}.pricegrid{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--ink);margin-top:35px}.pricecard{padding:24px;border-right:1px solid var(--ink)}.pricecard:last-child{border-right:0}.pricecard small{font-size:8px;color:var(--orange);font-weight:900}.pricecard b{display:block;font:500 32px Georgia,serif;margin:8px 0}.pricecard p{font-size:10px;line-height:1.5;color:#666}.cta-final{margin-top:30px;background:var(--ink);color:#fff;padding:35px;display:flex;justify-content:space-between;align-items:center;gap:30px}.cta-final h2{font:500 34px Georgia,serif;margin:0 0 7px}.cta-final p{color:#aaa;margin:0;max-width:560px;font-size:11px;line-height:1.5}@media(max-width:960px){.layout{grid-template-columns:1fr}.rail{display:none}.progress{overflow:auto}.progress button{white-space:nowrap}.flow{grid-template-columns:1fr 1fr 1fr}.step{border-bottom:1px solid var(--ink)}.step:nth-child(3){border-right:0}.step:not(:last-child):after{display:none}.data-map,.kpis{grid-template-columns:1fr 1fr}.bottom{left:0}.lesson{grid-template-columns:1fr}.lesson-body{border-left:0;border-top:1px solid var(--line);padding-left:0}.cta-final{display:block}.cta-final .btn{margin-top:20px}}@media(max-width:600px){.top{padding:0 14px}.progress button{font-size:9px;padding:7px 6px}.exit{display:none}.stage{padding:35px 18px 95px}.stage h1{font-size:45px}.flow{grid-template-columns:1fr}.step{border-right:0!important}.data-map,.kpis,.auditbox,.pricegrid{grid-template-columns:1fr}.pricecard{border-right:0;border-bottom:1px solid var(--ink)}.tr{grid-template-columns:1fr 1fr}.tr>*:nth-child(n+3){display:none}.decision{grid-template-columns:1fr}.bottom{padding:10px 14px}}
</style></head><body>

<div class="layout"><aside class="rail"><small>PERCORSO GUIDATO</small><h3 id="railTitle"></h3><p id="railCopy"></p><div class="railnav" id="railnav"></div></aside><main class="stage" id="stage"></main></div><div class="bottom"><button class="btn" id="prev">← Indietro</button><button class="btn dark" id="next">Continua →</button></div>
<script>
const sections=[
{id:'start',label:'Inizio',title:'Prima di configurare, capisci il sistema.',rail:'Questo percorso segue il dato dall’operatività fino alla decisione. È il modo più semplice per capire Easy Come.',html:()=>`<span class="eyebrow">COME SI USA DAVVERO</span><h1>Un dato nasce dal lavoro.<br>Easy Come gli dà un <em>percorso.</em></h1><p class="intro">Il punto non è avere più schermate. Il punto è sapere cosa succede dal momento in cui un cliente ti contatta fino al momento in cui quel lavoro diventa un numero, un controllo o una decisione. Per questo ti mostriamo Easy Come nell’ordine reale: Gestionale → Audit → Finance → Hub.</p><div class="lesson"><div class="lesson-label"><span>IL PRINCIPIO</span><b>Una sola fonte di verità.</b></div><div class="lesson-body"><p>Ogni informazione viene registrata una volta nel punto in cui nasce. Da lì continua a essere utilizzata dal resto del sistema. Se una prenotazione produce un incasso, non devi ricopiaiare il dato in Finance. Se una spesa è anomala, Audit la intercetta sullo stesso dato registrato nel gestionale.</p></div></div><div class="process"><div class="process-title"><h2>La mappa generale</h2><p>Il dato non si perde tra strumenti diversi.</p></div><div class="flow"><div class="step"><span class="n">01</span><h4>Evento reale</h4><p>Cliente, richiesta, spesa, incasso, prenotazione.</p></div><div class="step"><span class="n">02</span><h4>Gestionale</h4><p>Il dato viene registrato nel processo corretto.</p></div><div class="step"><span class="n">03</span><h4>Audit</h4><p>Easy Come verifica se qualcosa merita attenzione.</p></div><div class="step"><span class="n">04</span><h4>Finance</h4><p>Il dato diventa ricavo, costo, margine o cassa.</p></div><div class="step"><span class="n">05</span><h4>Decisione</h4><p>Il titolare capisce cosa fare e con quale priorità.</p></div><div class="step"><span class="n">06</span><h4>Hub</h4><p>Supporto, manuale e rapporto con Easy Come.</p></div></div></div>`},
{id:'gestionale',label:'Gestionale',title:'Gestionale: dove nasce il dato.',rail:'Qui avviene il lavoro quotidiano. Ogni processo ha un inizio, un responsabile e un punto di chiusura.',html:()=>`<span class="eyebrow">01 · GESTIONALE</span><h1>Prima lavori.<br>Poi il sistema <em>capisce.</em></h1><p class="intro">Il gestionale è il punto di partenza. Non ti chiediamo di “alimentare un software”: Easy Come registra ciò che stai già facendo e lo organizza in un percorso chiaro.</p><div class="process-picker"><button class="active" data-proc="booking">Prenotazione</button><button data-proc="payment">Incasso</button><button data-proc="expense">Spesa</button><button data-proc="customer">Cliente</button></div><div id="processMount"></div><div class="screen"><div class="screenbar"><span>Gestionale · esempio struttura ricettiva</span><span>Dato operativo</span></div><div class="screenbody"><div class="kpis"><div class="kpi"><strong>18</strong><span>prenotazioni attive</span></div><div class="kpi"><strong>4</strong><span>arrivi oggi</span></div><div class="kpi"><strong>€ 1.240</strong><span>incassi attesi</span></div><div class="kpi"><strong>2</strong><span>task urgenti</span></div></div><div class="table"><div class="tr"><span>Cliente</span><span>Risorsa</span><span>Arrivo</span><span>Stato</span></div><div class="tr"><b>Marco Bianchi</b><span>Piazzola 08</span><span>29 ago</span><span><i class="badge">Confermata</i></span></div><div class="tr"><b>Laura Conti</b><span>Piazzola 14</span><span>30 ago</span><span><i class="badge">Caparra ricevuta</i></span></div></div></div></div><div class="decision"><h3>Regola Easy Come</h3><p>Il dato va registrato nel punto in cui nasce. Chi gestisce la prenotazione aggiorna la prenotazione; chi registra l’incasso aggiorna il pagamento. Da quel momento Audit e Finance leggono gli stessi dati senza richiedere copie manuali.</p></div>`},
{id:'audit',label:'Audit',title:'Audit: controlla prima che il problema cresca.',rail:'Audit non crea dati nuovi: osserva quelli del gestionale e segnala ciò che sembra incoerente, incompleto o rischioso.',html:()=>`<span class="eyebrow">02 · AUDIT</span><h1>Il dato è registrato.<br>Adesso lo <em>controlliamo.</em></h1><p class="intro">Audit è il secondo passaggio perché ha bisogno dei dati operativi. Cerca situazioni che meritano attenzione e ti spiega sempre quale evidenza ha generato il controllo.</p><div class="process"><div class="process-title"><h2>Da dove arriva un rilievo</h2><p>Nessun “alert AI” senza origine.</p></div><div class="flow"><div class="step"><span class="n">01</span><h4>Dato gestionale</h4><p>Pagamento, fattura, spesa, prenotazione o cliente.</p></div><div class="step"><span class="n">02</span><h4>Regola di controllo</h4><p>Scadenza, duplicato, anomalia, incompletezza.</p></div><div class="step"><span class="n">03</span><h4>Evidenza</h4><p>Easy Come mostra esattamente cosa ha osservato.</p></div><div class="step"><span class="n">04</span><h4>Priorità</h4><p>Informativa, attenzione o critica.</p></div><div class="step"><span class="n">05</span><h4>Verifica umana</h4><p>Il titolare conferma se è un vero problema.</p></div><div class="step"><span class="n">06</span><h4>Azione</h4><p>Correggi il dato o pianifica il prossimo passo.</p></div></div></div><div class="auditbox"><article class="finding risk"><small>ALTA PRIORITÀ · PAGAMENTI</small><h4>Possibile pagamento duplicato</h4><p>Due movimenti da €225 per lo stesso cliente e la stessa data. Verifica prima di considerarli entrambi come incasso.</p></article><article class="finding warn"><small>ATTENZIONE · PRENOTAZIONI</small><h4>Prenotazione senza saldo registrato</h4><p>Il soggiorno risulta concluso ma il pagamento associato è ancora “Previsto”. Controlla il checkout.</p></article></div><div class="data-map"><div class="data-card"><small>INPUT</small><h4>Dati operativi</h4><p>Audit legge ciò che già esiste. Non chiede un secondo inserimento.</p></div><div class="data-card"><small>CONTROLLO</small><h4>Regole spiegabili</h4><p>Ogni rilievo mostra il motivo per cui è comparso.</p></div><div class="data-card"><small>UTENTE</small><h4>Il titolare verifica</h4><p>Un’anomalia non viene trattata automaticamente come errore.</p></div><div class="data-card"><small>OUTPUT</small><h4>Dato più affidabile</h4><p>Finance lavora su informazioni più pulite e controllate.</p></div></div>`},
{id:'finance',label:'Finance',title:'Finance: trasforma il lavoro in numeri.',rail:'Dopo aver registrato e controllato i dati, Finance li aggrega per spiegare come sta andando l’impresa.',html:()=>`<span class="eyebrow">03 · FINANCE</span><h1>Dal singolo movimento<br>alla <em>visione d’insieme.</em></h1><p class="intro">Finance non è un altro posto dove inserire numeri. Legge incassi, fatture e spese già presenti nel sistema e li trasforma in una vista gestionale.</p><div class="process"><div class="process-title"><h2>Come un soggiorno diventa informazione</h2><p>Stesso dato, livello diverso.</p></div><div class="flow"><div class="step"><span class="n">01</span><h4>Prenotazione</h4><p>€225 totale soggiorno.</p></div><div class="step"><span class="n">02</span><h4>Pagamento</h4><p>Caparra + saldo vengono registrati.</p></div><div class="step"><span class="n">03</span><h4>Ricavo</h4><p>Finance riconosce l’importo associato al periodo.</p></div><div class="step"><span class="n">04</span><h4>Costi</h4><p>Spese e fornitori vengono letti nello stesso mese.</p></div><div class="step"><span class="n">05</span><h4>Margine</h4><p>Ricavi e costi diventano risultato gestionale.</p></div><div class="step"><span class="n">06</span><h4>Decisione</h4><p>Capisci pricing, cassa e priorità.</p></div></div></div><div class="screen"><div class="screenbar"><span>Finance · agosto</span><span>Vista gestionale</span></div><div class="screenbody"><div class="kpis"><div class="kpi"><strong>€ 18.940</strong><span>ricavi registrati</span></div><div class="kpi"><strong>€ 5.210</strong><span>costi</span></div><div class="kpi"><strong>€ 13.730</strong><span>risultato gestionale</span></div><div class="kpi"><strong>72,5%</strong><span>margine indicativo</span></div></div><div class="table"><div class="tr"><span>Indicatore</span><span>Periodo</span><span>Valore</span><span>Lettura</span></div><div class="tr"><b>Incassi</b><span>Agosto</span><span>€18.110</span><span><i class="badge">in linea</i></span></div><div class="tr"><b>Crediti aperti</b><span>Oggi</span><span>€830</span><span>da seguire</span></div></div></div></div><div class="decision"><h3>Come va usato</h3><p>Finance serve al titolare per leggere l’azienda, non all’operatore per fare il lavoro quotidiano. La routine corretta è: dati aggiornati → Audit controllato → Finance letto → decisione presa.</p></div>`},
{id:'hub',label:'Hub',title:'Hub: quando serve Easy Come, sai dove andare.',rail:'Il prodotto non finisce con il software. Manuale, assistenza e richieste evolutive restano nello stesso rapporto operativo.',html:()=>`<span class="eyebrow">04 · EASY COME HUB</span><h1>Il sistema funziona.<br>E tu non resti <em>solo.</em></h1><p class="intro">L’Hub è il punto di contatto tra il cliente e Easy Come. Non è la schermata dove fai prenotazioni o leggi i margini: è dove capisci il prodotto, chiedi assistenza, segnali un problema e richiedi un’evoluzione.</p><div class="process"><div class="process-title"><h2>Quando usare l’Hub</h2><p>Separiamo lavoro aziendale e gestione del prodotto.</p></div><div class="flow"><div class="step"><span class="n">01</span><h4>Hai un dubbio</h4><p>Non ricordi come si usa una funzione.</p></div><div class="step"><span class="n">02</span><h4>Manuale</h4><p>Apri la guida personalizzata del tuo sistema.</p></div><div class="step"><span class="n">03</span><h4>Serve supporto</h4><p>Invii una richiesta contestualizzata.</p></div><div class="step"><span class="n">04</span><h4>Easy Come riceve</h4><p>La richiesta entra nel flusso di assistenza.</p></div><div class="step"><span class="n">05</span><h4>Intervento</h4><p>La gestione tecnica viene presa in carico.</p></div><div class="step"><span class="n">06</span><h4>Continuità</h4><p>Il tuo sistema resta mantenuto e supportato.</p></div></div></div><div class="data-map"><div class="data-card"><small>MANUALE</small><h4>Come si usa</h4><p>Istruzioni specifiche per il gestionale costruito sulla tua impresa.</p></div><div class="data-card"><small>ASSISTENZA</small><h4>Quando qualcosa non va</h4><p>Richiesta ordinata, con stato e storico.</p></div><div class="data-card"><small>EVOLUZIONE</small><h4>Quando cambi</h4><p>Puoi chiedere nuove funzioni o modifiche al processo.</p></div><div class="data-card"><small>OPERATIVO</small><h4>€150/mese</h4><p>Gestione tecnica, manutenzione, assistenza e continuità del sistema.</p></div></div>`},
{id:'build',label:'Crea',title:'Adesso puoi decidere cosa costruire.',rail:'Il configuratore arriva solo qui. Prima hai visto il prodotto, ora puoi tradurre i tuoi processi nel tuo Easy Come.',html:()=>`<span class="eyebrow">ADESSO CONFIGURI</span><h1>Hai visto il percorso.<br>Ora costruisci il <em>tuo.</em></h1><p class="intro">Nel configuratore scegli soltanto ciò che serve alla tua impresa. Easy Come parte dai processi che vuoi gestire e genera il sistema da provare prima dell’attivazione.</p><div class="pricegrid"><article class="pricecard"><small>SOFTWARE</small><b>da €99</b><p>Prezzo una tantum del pacchetto. Aumenta in base ai moduli e alle personalizzazioni che scegli.</p></article><article class="pricecard"><small>IMPLEMENTAZIONE · OBBLIGATORIA</small><b>€150</b><p>Configurazione tecnica, setup, controlli e messa in funzione del prodotto acquistato.</p></article><article class="pricecard"><small>EASY COME OPERATIVO · OBBLIGATORIO</small><b>€150/mese</b><p>Funzionamento continuativo: gestione tecnica, manutenzione, assistenza e continuità del sistema.</p></article></div><div class="lesson"><div class="lesson-label"><span>IL FLOW COMMERCIALE</span><b>Capisci → Configura → Prova → Attiva.</b></div><div class="lesson-body"><p>Non paghi per scoprire cosa hai comprato. Configuri il sistema, navighi l’anteprima e solo dopo procedi all’attivazione. Implementazione e Easy Come Operativo fanno parte del modello e non sono opzioni da togliere.</p></div></div><div class="cta-final"><div><h2>Crea il tuo Easy Come.</h2><p>Hai completato il percorso. Il configuratore adesso ha senso perché sai già cosa stai costruendo e come verrà usato.</p></div><a class="btn orange" id="configure" href="studio.html">Apri il configuratore →</a></div>`}
];
const processes={

payment:{title:'Processo · Incasso',sub:'Dal pagamento reale alla cassa',steps:[['Evento','Il cliente paga caparra o saldo.'],['Associazione','Il movimento viene legato al cliente/prenotazione.'],['Metodo','Contanti, carta, bonifico o online.'],['Stato','Ricevuto, previsto o rimborsato.'],['Audit','Controllo duplicati e incoerenze.'],['Finance','Il movimento contribuisce agli incassi e alla cassa.']],cards:[['DOVE NASCE','Quando il denaro viene effettivamente ricevuto.'],['CHI LO USA','Chi incassa e il titolare.'],['DOVE FINISCE','Registro pagamenti, Audit e Finance.'],['REGOLA','Un pagamento va registrato una sola volta.']]},

let current=0;const stage=document.getElementById('stage'),progress=document.getElementById('progress'),railnav=document.getElementById('railnav');
function renderProcess(id){const p=processes[id];const m=document.getElementById('processMount');if(!m)return;m.innerHTML=`<div class="process"><div class="process-title"><h2>${p.title}</h2><p>${p.sub}</p></div><div class="flow">${p.steps.map((s,i)=>`<div class="step"><span class="n">0${i+1}</span><h4>${s[0]}</h4><p>${s[1]}</p></div>`).join('')}</div></div><div class="data-map">${p.cards.map(c=>`<div class="data-card"><small>${c[0]}</small><h4>${c[1]}</h4></div>`).join('')}</div>`;document.querySelectorAll('[data-proc]').forEach(b=>b.classList.toggle('active',b.dataset.proc===id));}
function render(){const s=sections[current];stage.innerHTML=s.html();document.getElementById('railTitle').textContent=s.title;document.getElementById('railCopy').textContent=s.rail;progress.innerHTML=sections.map((x,i)=>`<button data-i="${i}" class="${i===current?'active':''} ${i<current?'done':''}">${x.label}</button>`).join('');railnav.innerHTML=sections.map((x,i)=>`<button data-i="${i}" class="${i===current?'active':''}">${String(i+1).padStart(2,'0')} · ${x.label}</button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{current=Number(b.dataset.i);render();scrollTo(0,0)});document.getElementById('prev').style.visibility=current===0?'hidden':'visible';document.getElementById('next').textContent=current===sections.length-1?'Configura →':'Continua →';document.getElementById('next').className='btn '+(current===sections.length-1?'orange':'dark');document.querySelectorAll('[data-proc]').forEach(b=>b.onclick=()=>renderProcess(b.dataset.proc));if(s.id==='gestionale')renderProcess('booking');document.getElementById('configure')?.addEventListener('click',()=>{try{localStorage.setItem('easycome:product-tour-seen','1')}catch(e){}})}
document.getElementById('prev').onclick=()=>{if(current>0){current--;render();scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(current<sections.length-1){current++;render();scrollTo(0,0)}else{try{localStorage.setItem('easycome:product-tour-seen','1')}catch(e){};location.href='studio.html'}};render();
</script></body></html>
