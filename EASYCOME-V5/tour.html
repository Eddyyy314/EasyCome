<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scopri Easy Come Hospitality</title><meta name="theme-color" content="#171713"><style>
:root{--paper:#f3efe7;--card:#fffdf9;--ink:#171713;--muted:#746e65;--line:#d8d0c5;--orange:#ff5a2f;--green:#2f6d50}*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{font:inherit;color:inherit}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 22px}.brand{display:flex;align-items:center;gap:9px;text-decoration:none}.brand>span{width:31px;height:31px;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:7px;font-weight:900}.brand b{font:400 17px Georgia,serif}.chapters{margin-left:auto;display:flex;gap:2px}.chapters button{border:0;background:transparent;padding:8px 10px;font-size:7px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent}.chapters button.active{color:var(--ink);border-color:var(--orange);font-weight:900}.stage{min-height:calc(100vh - 126px)}.chapter{display:none;width:min(1180px,calc(100% - 38px));margin:auto;padding:46px 0}.chapter.active{display:grid;grid-template-columns:.78fr 1.22fr;gap:48px;align-items:center}.copy>span{font-size:8px;letter-spacing:.15em;color:var(--orange);font-weight:900}.copy h1{font:400 clamp(45px,5vw,70px)/.92 Georgia,serif;letter-spacing:-.04em;margin:13px 0 17px}.copy p{font-size:12px;line-height:1.65;color:var(--muted);max-width:480px}.value{margin-top:23px;padding-top:17px;border-top:1px solid var(--line)}.value b{font:400 22px Georgia,serif;display:block}.value span{font-size:8px;color:var(--muted);display:block;margin-top:5px}.mock{background:#171713;border-radius:16px;padding:8px;box-shadow:25px 30px 0 #17171309,0 25px 70px #17171318}.screen{background:#f5f1e9;min-height:520px;border-radius:10px;overflow:hidden;display:grid;grid-template-columns:135px 1fr}.side{background:#171713;color:#fff;padding:15px 9px}.side h4{font:400 10px Georgia,serif;margin:0 0 17px;padding:0 8px}.side span{display:block;padding:8px;border-radius:6px;font-size:7px;color:#ffffff68;margin:2px 0}.side span.on{background:#ffffff0d;color:#fff;box-shadow:inset 2px 0 0 var(--orange)}.main{padding:21px}.head small{font-size:6px;color:var(--orange);font-weight:900;letter-spacing:.12em}.head h2{font:400 26px Georgia,serif;margin:5px 0 12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.kpi,.card{background:#fffdf9;border:1px solid #d8d0c5;border-radius:8px}.kpi{padding:10px}.kpi span,.kpi b{display:block}.kpi span{font-size:5px;color:#746e65}.kpi b{font:400 17px Georgia,serif;margin-top:5px}.card{padding:12px;margin-top:6px}.card>span{font-size:5px;color:var(--orange);font-weight:900}.row{display:grid;grid-template-columns:70px 1fr auto;gap:7px;align-items:center;border-top:1px solid #e7dfd5;padding:9px 0}.row time{font-size:5px;color:#746e65}.row b,.row small{display:block}.row b{font-size:6px}.row small{font-size:5px;color:#746e65;margin-top:2px}.row em{font-style:normal;color:var(--orange);font-size:5px}.cal{display:grid;grid-template-columns:100px repeat(5,1fr);border:1px solid #d8d0c5;background:#fffdf9;margin-top:8px}.cal>*{min-height:54px;border-right:1px solid #ddd4ca;border-bottom:1px solid #ddd4ca;padding:6px;font-size:5px}.cal .b{background:#e6efe8;border-left:3px solid var(--green)}.tabs{display:flex;gap:5px;margin:7px 0}.tabs span{font-size:6px;border:1px solid #d8d0c5;background:#fffdf9;border-radius:6px;padding:6px 8px}.tabs span.on{background:#171713;color:#fff}.bar{display:grid;grid-template-columns:80px 1fr 60px;gap:8px;align-items:center;margin:13px 0}.bar span,.bar b{font-size:6px}.bar i{height:7px;background:#e6ded4}.bar i:after{content:"";display:block;height:100%;width:65%;background:var(--green)}.bottom{height:64px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:#f3efe7e9;position:sticky;bottom:0}.bottom span{font-size:8px;color:var(--muted)}.bottom div{display:flex;gap:7px}.bottom button,.bottom a{height:38px;border:1px solid var(--ink);background:transparent;border-radius:7px;padding:0 13px;font-size:8px;font-weight:850;text-decoration:none;display:flex;align-items:center}.bottom .dark{background:var(--ink);color:#fff}.bottom .orange{background:var(--orange);border-color:var(--orange);color:#fff}@media(max-width:900px){.chapters{display:none}.chapter.active{grid-template-columns:1fr;gap:25px}.mock{max-width:800px}.chapter{padding:30px 0}.copy h1{font-size:52px}}@media(max-width:560px){.screen{grid-template-columns:1fr}.side{display:none}.main{padding:13px}.kpis{grid-template-columns:1fr 1fr}.bottom>span{display:none}.bottom{justify-content:flex-end}.chapter{width:min(100% - 24px,1180px)}}
</style><style id="v3-tour-theme">:root{--orange:#ff5b35!important}body{background:radial-gradient(circle at 85% 0,rgba(255,91,53,.08),transparent 26%),#f3f1ec!important}.top,.bottom{backdrop-filter:blur(18px)}.chapter h1{letter-spacing:-.045em}.screen,.product-shell,.demo-screen{border-radius:22px!important;box-shadow:0 32px 90px rgba(20,18,15,.13)!important}.btn{border-radius:11px!important}.btn.orange{background:#ff5b35!important}.chapter-nav button.active{background:#171815!important}.final-card{border-radius:26px!important}</style></head><body><header class="top"><a class="brand" href="index.html"><span>EC</span><b>Easy Come Hospitality</b></a><nav class="chapters" id="nav"></nav></header><main class="stage" id="stage"></main><footer class="bottom"><span id="progress">1 / 6</span><div><button id="prev">Indietro</button><button class="dark" id="next">Continua</button><a class="orange" id="configure" href="studio.html" style="display:none">Configura il tuo</a></div></footer><script>
const chapters=[{k:'IL PRINCIPIO',t:'Apri Easy Come. Sai cosa fare.',p:'Un B&B non ha bisogno di cento menu. Easy Come apre la giornata e mette in ordine arrivi, partenze, camere da preparare, documenti e incassi.',v:'La home del gestionale non è una dashboard. È una lista di decisioni.',view:'today'},{k:'01 · OGGI',t:'Prima le cose che richiedono attenzione.',p:'Ogni mattina vedi solo ciò che deve essere chiuso: chi arriva, chi parte, cosa manca, cosa va incassato e quale camera non è pronta.',v:'Meno memoria. Meno WhatsApp. Meno fogli aperti.',view:'today'},{k:'02 · CALENDARIO',t:'Disponibilità e soggiorni in una sola vista.',p:'Le camere sono righe, i giorni sono colonne. Clicchi un soggiorno e apri il suo fascicolo completo senza cambiare software.',v:'Il calendario serve a vedere, non a nascondere informazioni.',view:'calendar'},{k:'03 · PRENOTAZIONI',t:'Una prenotazione è un solo oggetto.',p:'Ospite, camera, date, canale, saldo, documenti, messaggi e adempimenti restano collegati allo stesso soggiorno. Non li ricopi in sezioni diverse.',v:'Il dato nasce una volta e viene riutilizzato.',view:'bookings'},{k:'04 · OPERAZIONI',t:'Il lavoro operativo diventa un flusso.',p:'Arrivi, pulizie, Alloggiati Web, statistiche, tassa di soggiorno e canali compaiono qui quando sono rilevanti. Le funzioni extra potenziano il flusso senza creare nuovi menu.',v:'Ogni cosa ha un posto, ma non diventa una nuova app.',view:'operations'},{k:'05 · NUMERI',t:'I numeri devono aiutarti a decidere.',p:'Occupazione, ADR, RevPAR e saldi sono sempre disponibili. Se vuoi andare oltre, Easy Come aggiunge costi e margini senza trasformarsi in un software contabile.',v:'Pochi indicatori. Quelli che servono davvero.',view:'numbers'}];let i=0;const nav=document.getElementById('nav'),stage=document.getElementById('stage');function mock(v){const side=['Oggi','Calendario','Prenotazioni','Operazioni','Numeri'];let body='';if(v==='calendar')body=`<div class="head"><small>CALENDARIO</small><h2>Tutta la struttura in una vista.</h2></div><div class="cal"><b>Camera</b>${['Lun','Mar','Mer','Gio','Ven'].map(x=>`<b>${x}</b>`).join('')}${['Matrimoniale 1','Matrimoniale 2','Suite'].map((r,j)=>`<b>${r}</b>${[0,1,2,3,4].map(d=>(j===0&&d<3)||(j===1&&d<2)||(j===2&&d>1)?`<span class="b">${['Giulia','Marco','Anna'][j]}</span>`:'<span></span>').join('')}`).join('')}</div>`;else if(v==='bookings')body=`<div class="head"><small>PRENOTAZIONI</small><h2>Ogni soggiorno in un posto.</h2></div><div class="card">${['Giulia Romano','Marco De Luca','Anna Klein','Sophie Martin'].map((x,j)=>`<div class="row"><time>EC-18${4+j}</time><span><b>${x}</b><small>${['Matrimoniale 1 · Diretta','Matrimoniale 2 · Booking.com','Suite · Airbnb','Matrimoniale 1 · Diretta'][j]}</small></span><em>Apri</em></div>`).join('')}</div>`;else if(v==='operations')body=`<div class="head"><small>OPERAZIONI</small><h2>Il lavoro che deve essere fatto.</h2></div><div class="tabs"><span class="on">Arrivi</span><span>Pulizie</span><span>Adempimenti</span><span>Controlli</span></div><div class="card"><div class="row"><time>14:30</time><span><b>Giulia Romano</b><small>Dati ospite pronti · €300 da incassare</small></span><em>Apri</em></div><div class="row"><time>Camera 3</time><span><b>Pulizia da completare</b><small>Maria · priorità alta</small></span><em>Fatto</em></div><div class="row"><time>Alloggiati</time><span><b>2 schede da inviare</b><small>Prima della scadenza</small></span><em>Vedi</em></div></div>`;else if(v==='numbers')body=`<div class="head"><small>NUMERI</small><h2>Come sta andando.</h2></div><div class="kpis"><div class="kpi"><span>OCCUPAZIONE</span><b>71%</b></div><div class="kpi"><span>ADR</span><b>€118</b></div><div class="kpi"><span>REVPAR</span><b>€84</b></div><div class="kpi"><span>DA INCASSARE</span><b>€1.100</b></div></div><div class="card"><span>VALORE PRENOTAZIONI</span><div class="bar"><span>Dirette</span><i></i><b>€3.240</b></div><div class="bar"><span>Portali</span><i style="filter:hue-rotate(130deg)"></i><b>€5.180</b></div></div>`;else body=`<div class="head"><small>OGGI</small><h2>Buongiorno. Ecco cosa conta.</h2></div><div class="kpis"><div class="kpi"><span>OCCUPATE</span><b>3/6</b></div><div class="kpi"><span>ARRIVI</span><b>2</b></div><div class="kpi"><span>PARTENZE</span><b>1</b></div><div class="kpi"><span>DA INCASSARE</span><b>€590</b></div></div><div class="card"><span>DA FARE ADESSO</span>${[['14:30','Completa dati Giulia','Matrimoniale 1'],['16:00','Incassa €290','Marco De Luca'],['Prima arrivo','Prepara Camera 3','Maria']].map(x=>`<div class="row"><time>${x[0]}</time><span><b>${x[1]}</b><small>${x[2]}</small></span><em>Apri</em></div>`).join('')}</div>`;return `<div class="mock"><div class="screen"><aside class="side"><h4>Dimora Aurora</h4>${side.map(x=>`<span class="${x.toLowerCase()===v||(v==='bookings'&&x==='Prenotazioni')||(v==='operations'&&x==='Operazioni')||(v==='numbers'&&x==='Numeri')||(v==='calendar'&&x==='Calendario')||(v==='today'&&x==='Oggi')?'on':''}">${x}</span>`).join('')}</aside><section class="main">${body}</section></div></div>`}function render(){const c=chapters[i];nav.innerHTML=chapters.map((x,n)=>`<button class="${n===i?'active':''}" data-i="${n}">${x.k.replace(/^\d+ · /,'')}</button>`).join('');nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{i=+b.dataset.i;render()});stage.innerHTML=`<section class="chapter active"><div class="copy"><span>${c.k}</span><h1>${c.t}</h1><p>${c.p}</p><div class="value"><b>${c.v}</b><span>È questa la logica che resta nel prodotto finale.</span></div></div>${mock(c.view)}</section>`;document.getElementById('prev').disabled=i===0;document.getElementById('next').style.display=i===chapters.length-1?'none':'flex';document.getElementById('configure').style.display=i===chapters.length-1?'flex':'none';document.getElementById('progress').textContent=`${i+1} / ${chapters.length}`};document.getElementById('prev').onclick=()=>{if(i>0){i--;render()}};document.getElementById('next').onclick=()=>{if(i<chapters.length-1){i++;render()}};render();
</script></body></html>
